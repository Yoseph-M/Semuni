version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: semuni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: semuni
      POSTGRES_PASSWORD: semuni_dev_password
      POSTGRES_DB: semuni
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U semuni']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semuni-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: semuni
      DB_PASSWORD: semuni_dev_password
      DB_DATABASE: semuni
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
      PAYMENT_PROVIDER: MOCK

volumes:
  pgdata:
