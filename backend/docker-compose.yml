version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: semuni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-semuni}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semuni_dev_password}
      POSTGRES_DB: ${DB_DATABASE:-semuni}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-semuni}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semuni-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    # Secrets come from backend/.env (never committed); only the in-network
    # database host is overridden here.
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432

volumes:
  pgdata:
